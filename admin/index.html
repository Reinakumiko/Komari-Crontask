<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定时任务 · Cron Task</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --faint: #94a3b8;
    --primary: #0284c7; --primary-deep: #0369a1; --primary-soft: #e0f2fe;
    --danger: #dc2626; --danger-soft: #fee2e2;
    --success: #16a34a; --success-soft: #dcfce7;
    --warn: #d97706; --warn-soft: #fef3c7;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.65 -apple-system, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

  header { position: sticky; top: 0; z-index: 10;
           background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--border);
           padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
  header .brand { display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .ver { color: var(--faint); font-size: 12px; font-family: var(--mono); cursor: pointer; }
  header .ver:hover { color: var(--primary); }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  main { max-width: 1000px; margin: 24px auto 40px; padding: 0 20px; }

  button { background: var(--primary); color: #fff; border: 0; border-radius: 8px;
           padding: 7px 14px; font-size: 13px; cursor: pointer; transition: filter .12s, background .12s; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: #f8fafc; filter: none; }
  .btn-run { background: var(--primary); color: #fff; font-weight: 600; }
  .btn-run:hover { background: var(--primary-deep); filter: none; }
  .btn-pause { background: var(--warn-soft); color: var(--warn); font-weight: 600; border: 1px solid #fde68a; }
  .btn-pause:hover { background: #fde68a; filter: none; }
  .btn-resume { background: var(--success-soft); color: var(--success); font-weight: 600; border: 1px solid #bbf7d0; }
  .btn-resume:hover { background: #bbf7d0; filter: none; }
  button.ghost { background: transparent; color: var(--muted); padding: 4px 8px; }
  button.ghost:hover { background: #f1f5f9; color: var(--text); filter: none; }
  button.ghost.danger { color: var(--danger); }
  button.ghost.danger:hover { background: var(--danger-soft); color: var(--danger); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .card-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-size: 14px; font-weight: 650; }
  .card-title .sub { color: var(--faint); font-size: 12px; font-weight: 400; }
  .card-title .right { margin-left: auto; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px;
           border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok   { background: var(--success-soft); color: var(--success); }
  .badge.fail { background: var(--danger-soft);  color: var(--danger); }
  .badge.warn { background: var(--warn-soft);    color: var(--warn); }
  .badge.on   { background: var(--success-soft); color: var(--success); }
  .badge.off  { background: #f1f5f9;             color: var(--faint); }

  .muted { color: var(--muted); }
  .mono  { font-family: var(--mono); }
  .error-banner { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca;
                  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; display: none; }
  .empty { color: var(--faint); text-align: center; padding: 36px 0; font-size: 13px; }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
           background: #0f172a; color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 13px;
           opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
           box-shadow: 0 8px 24px rgba(15,23,42,.3); }
  .toast.show { opacity: 1; }

  /* ---------- 任务表 ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 8px 10px; color: var(--faint); font-weight: 500;
       font-size: 12px; text-transform: uppercase; letter-spacing: .4px;
       border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #f8fafc; }
  .t-name { font-weight: 600; word-break: break-all; }
  .t-cron { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-top: 1px; }
  .t-cmd { font-family: var(--mono); font-size: 12px; background: #f8fafc; border: 1px solid #eef2f7;
           padding: 3px 8px; border-radius: 6px; display: -webkit-box; -webkit-box-orient: vertical;
           -webkit-line-clamp: 2; overflow: hidden; word-break: break-all;
           line-height: 1.5; max-width: 420px; }
  .node-pill { display: inline-block; background: var(--primary-soft); color: #075985;
               border-radius: 6px; padding: 1px 8px; font-size: 12px; margin: 1px 3px 1px 0;
               max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               vertical-align: middle; }
  .node-pill.custom { background: var(--warn-soft); color: #92400e; font-family: var(--mono); font-size: 11px; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row-actions .btn-run, .row-actions .btn-pause, .row-actions .btn-resume { padding: 5px 12px; font-size: 12.5px; }
  .row-actions button.ghost { font-size: 12.5px; }

  /* ---------- 历史记录（可展开） ---------- */
  .h-item { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
            overflow: hidden; background: #fff; }
  .h-item:hover { border-color: #cbd5e1; }
  .h-item.open { border-color: var(--primary); }
  .h-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap;
            cursor: pointer; user-select: none; }
  .h-name { font-weight: 650; font-size: 13.5px; }
  .h-time { color: var(--faint); font-size: 12px; margin-left: auto; text-align: right; }
  .h-toggle { font-size: 12px; color: var(--faint); transition: transform .15s; }
  .h-item.open .h-toggle { transform: rotate(180deg); color: var(--primary); }
  .h-body { border-top: 1px solid #f1f5f9; }
  .h-cmd { font-family: var(--mono); font-size: 12px; color: var(--muted);
           background: #f8fafc; padding: 6px 14px; border-bottom: 1px solid #f1f5f9; word-break: break-all;
           display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; line-height: 1.5; }
  .h-cmd::before { content: "$ "; color: var(--faint); }
  .h-node { padding: 10px 14px; }
  .h-node + .h-node { border-top: 1px dashed #eef2f7; }
  .h-node-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .h-node-name { font-weight: 600; font-size: 13px; }
  .h-exit { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 6px; }
  .h-exit.zero { background: var(--success-soft); color: var(--success); }
  .h-exit.nonzero { background: var(--danger-soft); color: var(--danger); }
  .h-out { background: #0f172a; color: #e2e8f0; font-family: var(--mono); font-size: 12px;
           line-height: 1.55; border-radius: 8px; padding: 10px 12px;
           white-space: pre-wrap; word-break: break-all; max-height: 260px; overflow-y: auto; }
  .h-out:empty::after { content: "（无输出）"; color: #64748b; }
  .h-noresult { color: var(--faint); font-size: 12px; padding: 0 14px 10px; }

  /* ---------- 弹框 ---------- */
  dialog { border: 0; border-radius: 14px; padding: 0;
           width: min(680px, calc(100vw - 32px));
           box-shadow: 0 24px 64px rgba(15,23,42,.28); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .dlg-head .close { margin-left: auto; background: none; color: var(--faint); font-size: 17px; padding: 2px 8px; }
  .dlg-head .close:hover { color: var(--text); background: #f1f5f9; filter: none; }
  .dlg-body { padding: 18px 22px; max-height: calc(100vh - 220px); overflow-y: auto; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px;
              padding: 13px 22px; border-top: 1px solid var(--border); background: #f8fafc;
              border-radius: 0 0 14px 14px; }
  .dlg-foot #btnSave { padding: 8px 22px; font-weight: 600; }

  .section { margin-bottom: 22px; }
  .section:last-child { margin-bottom: 0; }
  .section > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
                  font-size: 12px; font-weight: 600; color: var(--muted);
                  text-transform: uppercase; letter-spacing: .5px; }
  .section > h3::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--primary); }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  label { display: block; font-size: 12.5px; margin-bottom: 5px; font-weight: 600; color: #334155; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; transition: border-color .12s, box-shadow .12s; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,.12); }

  textarea.term { width: 100%; resize: vertical; min-height: 96px;
    background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6; padding: 10px 12px;
    caret-color: #38bdf8; transition: border-color .12s, box-shadow .12s; }
  textarea.term::placeholder { color: #475569; }
  textarea.term:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.15); }

  /* ---------- cron 可视化选择器（左时间 / 右频率+参数） ---------- */
  .cron-wizard { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
  .cron-main { display: flex; min-height: 200px; }
  .cron-time { width: 150px; flex: none; border-right: 1px solid #f1f5f9; background: #f8fafc;
               display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
               padding: 16px 10px; gap: 6px; }
  .cron-time .cap { color: var(--faint); font-size: 11.5px; }
  .cron-time input[type=time] { font-family: var(--mono); font-size: 16px;
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; width: 118px;
    background: #fff; text-align: center; }
  .cron-time input[type=time]:focus { outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(2,132,199,.12); }
  .cron-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .cron-freq { display: flex; gap: 2px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
  .cron-freq button { font-size: 12px; padding: 4px 12px; border-radius: 999px;
    background: #f1f5f9; color: var(--muted); border: 1px solid var(--border); }
  .cron-freq button:hover { background: var(--primary-soft); color: var(--primary-deep); border-color: #bae6fd; filter: none; }
  .cron-freq button.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .cron-config { padding: 12px 14px; flex: 1; display: flex; align-items: center; }
  .cron-config .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }
  .cron-config .pick-time { display: flex; align-items: center; gap: 6px; }
  .cron-config .pick-time .lbl { color: var(--faint); font-size: 12px; }
  .cron-config .num { width: 72px; }
  .cron-config .num-unit { display: flex; align-items: center; gap: 6px; }
  .cron-config .num-unit .lbl { color: var(--faint); font-size: 12px; }
  .cron-multiselect { display: flex; gap: 5px; flex-wrap: wrap; }
  .cron-multiselect button { width: 33px; height: 33px; border-radius: 8px; font-size: 12px;
    background: #f1f5f9; color: var(--muted); border: 1px solid var(--border); padding: 0; }
  .cron-multiselect button.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .cron-multiselect button.month { width: auto; padding: 0 8px; }
  .cron-mday select { font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .cron-note { color: var(--faint); font-size: 11.5px; }
  .cron-custom-input { width: 100%; font-family: var(--mono); font-size: 13px;
    padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; }
  .cron-custom-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,.12); }
  .cron-preview { font-family: var(--mono); font-size: 13px; color: var(--primary-deep);
    background: var(--primary-soft); border-top: 1px solid #bae6fd; padding: 7px 14px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cron-preview .cap { color: var(--faint); font-size: 11px; }
  .cron-preview .human { color: var(--muted); font-size: 12px; margin-left: auto; }

  /* 行式控件（opt-row 右侧带输入框的变体） */
  .opt-input { display: flex; align-items: center; gap: 6px; flex: none; }
  .opt-input input { width: 90px; text-align: right; font-size: 13.5px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 8px; font-family: var(--mono); }
  .opt-input input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,.12); }
  .opt-input .unit { color: var(--muted); font-size: 12.5px; }

  /* ---------- 开关行（title/desc 分行） ---------- */
  .opt-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
             border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px;
             cursor: pointer; transition: border-color .12s, background .12s; }
  .opt-row:hover { border-color: #cbd5e1; background: #f8fafc; }
  .opt-row .opt-text { flex: 1; min-width: 0; }
  .opt-title { font-size: 14px; font-weight: 650; color: var(--text); display: block; }
  .opt-desc { font-size: 12px; color: var(--faint); margin-top: 2px; display: block; line-height: 1.5; }
  .switch { position: relative; width: 44px; height: 25px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px;
                    transition: background .15s; }
  .switch .slider::before { content: ""; position: absolute; width: 19px; height: 19px;
                            left: 3px; top: 3px; background: #fff; border-radius: 50%;
                            box-shadow: 0 1px 3px rgba(15,23,42,.25); transition: transform .15s; }
  .switch input:checked + .slider { background: var(--primary); }
  .switch input:checked + .slider::before { transform: translateX(19px); }
  .switch input:focus-visible + .slider { box-shadow: 0 0 0 3px rgba(2,132,199,.2); }

  /* ---------- 节点选择器 ---------- */
  .node-picker { border: 1px solid var(--border); border-radius: 8px; background: #fff; overflow: hidden; }
  .node-picker:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,.12); }
  .node-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; min-height: 42px; }
  .node-chips .placeholder { color: var(--faint); font-size: 12px; align-self: center; padding: 0 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--primary-soft);
          color: #075985; border-radius: 999px; padding: 2.5px 6px 2.5px 11px; font-size: 12px; font-weight: 500;
          max-width: 200px; }
  .chip .chip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button { background: none; color: #075985; padding: 0 4px; font-size: 13px; line-height: 1; }
  .chip button:hover { color: var(--danger); }
  .chip.custom { background: var(--warn-soft); color: #92400e; font-family: var(--mono); font-size: 11px; }
  .node-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid #f1f5f9; }
  .node-toolbar .search { flex: 1; display: flex; align-items: center; border: 1px solid var(--border);
                          border-radius: 8px; padding: 0 10px; background: #f8fafc; }
  .node-toolbar .search:focus-within { border-color: var(--primary); background: #fff; }
  .node-toolbar .search .icon { color: var(--faint); font-size: 13px; }
  .node-toolbar .search input { border: 0; background: transparent; padding: 7px 8px; font-size: 13px; width: 100%; }
  .node-toolbar .search input:focus { outline: none; box-shadow: none; }
  .node-toolbar .count { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .node-list { max-height: 180px; overflow-y: auto; }
  .node-item { display: flex; align-items: center; gap: 9px; padding: 7px 11px; cursor: pointer; }
  .node-item:hover { background: #f8fafc; }
  .node-item input { accent-color: var(--primary); }
  .node-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  .node-empty { padding: 12px; color: var(--faint); font-size: 12px; }
  .node-add-custom { padding: 8px 11px; font-size: 12px; color: var(--muted); }
  .node-add-custom button { font-size: 12px; padding: 3px 9px; }

</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>定时任务</h1>
    <span class="ver">cron-task v0.3.5</span>
  </div>
  <div class="actions">
    <button class="secondary" id="btnRefresh">刷新</button>
    <button id="btnNew">＋ 新建任务</button>
  </div>
</header>

<main>
  <div class="error-banner" id="errorBanner"></div>

  <div class="card">
    <div class="card-title">任务 <span class="sub" id="taskCount"></span></div>
    <table>
      <thead>
        <tr><th>任务</th><th>命令</th><th>目标节点</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="tasksBody"></tbody>
    </table>
    <div class="empty" id="tasksEmpty" style="display:none">暂无任务，点击右上角「新建任务」开始</div>
  </div>

  <div class="card">
    <div class="card-title">执行历史 <span class="sub" id="historyCount"></span>
      <span class="right">
        <button class="ghost" id="btnExpandAll">全部展开</button>
        <button class="ghost" id="btnCollapseAll">全部收起</button>
      </span>
    </div>
    <div id="historyList"><div class="empty">加载中…</div></div>
  </div>

  <div class="card">
    <div class="card-title">操作日志 <span class="sub" id="auditCount"></span>
      <span class="right"><button class="ghost" id="btnRefreshAudit">刷新</button></span>
    </div>
    <div id="auditList"><div class="empty">加载中…</div></div>
  </div>
</main>

<!-- 新建/编辑任务弹框 -->
<dialog id="taskDialog">
  <form id="taskForm" method="dialog" style="margin:0">
    <div class="dlg-head">
      <h2 id="formTitle">新建任务</h2>
      <button type="button" class="close" id="btnClose" aria-label="关闭">✕</button>
    </div>
    <div class="dlg-body">
      <input type="hidden" id="f_id">
      <input type="hidden" id="f_cron">

      <div class="section">
        <h3>基本信息</h3>
        <div class="field">
          <label for="f_name">任务名称</label>
          <input type="text" id="f_name" placeholder="例如: 每日磁盘清理" required>
        </div>
        <div class="field">
          <label>执行周期</label>
          <div class="cron-wizard">
            <div class="cron-main">
              <div class="cron-time">
                <span class="cap">什么时候执行</span>
                <input type="time" id="cronTime" value="03:00">
              </div>
              <div class="cron-right">
                <div class="cron-freq">
                  <button type="button" data-freq="daily" class="active">每天</button>
                  <button type="button" data-freq="everyndays">每 N 天</button>
                  <button type="button" data-freq="weekly">每周几</button>
                  <button type="button" data-freq="monthly">每月几号</button>
                  <button type="button" data-freq="months">每年某月</button>
                  <button type="button" data-freq="interval">固定间隔</button>
                  <button type="button" data-freq="custom">自定义</button>
                </div>
                <div class="cron-config">
                  <div class="row" data-cfg="daily">
                    <span class="muted">每天在左侧选定的时间执行</span>
                  </div>
                  <div class="row" data-cfg="everyndays" style="display:none">
                    <span class="num-unit"><span class="lbl">每</span><input type="number" id="cronEveryDays" class="num" value="2" min="1" max="30"><span class="lbl">天</span></span>
                  </div>
                  <div class="row" data-cfg="weekly" style="display:none">

<!-- 更新日志弹框 -->


<div class="toast" id="toast"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let NODES = [];
let selectedNodes = new Set();
const dialog = $("taskDialog");

// ---------- 通用 ----------
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
function showError(msg) {
  const b = $("errorBanner");
  b.textContent = msg;
  b.style.display = msg ? "block" : "none";
}
async function rpc(method, params) {
  const res = await fetch("/api/rpc2", {
    method: "POST", headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params: params ?? {} }),
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const body = await res.json();
  if (body.error) throw new Error(body.error.message || body.error.code);
  return body.result;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function nodeLabel(id) {
  const n = NODES.find((x) => x.uuid === id);
  return n && n.name ? n.name : null;
}
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60e3) return "刚刚";
  if (diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + " 小时前";
  return Math.floor(diff / 86400e3) + " 天前";
}

// ---------- 任务列表 ----------
function nodePills(ids) {
  return ids.map((id) => {
    const label = nodeLabel(id);
    return label
      ? `<span class="node-pill" title="${esc(id)}">${esc(label)}</span>`
      : `<span class="node-pill custom" title="节点已不在线，保留 ID">${esc(id.slice(0, 8))}…</span>`;
  }).join("");
}
function taskRow(t) {
  const status = t.enabled ? '<span class="badge on">启用</span>' : '<span class="badge off">停用</span>';
  const toggleBtn = t.enabled
    ? `<button data-act="toggle" class="btn-pause" title="停止定时触发">⏸ 停用</button>`
    : `<button data-act="toggle" class="btn-resume" title="恢复定时触发">▶ 启用</button>`;
  return `<tr data-id="${esc(t.id)}">
    <td><div class="t-name">${esc(t.name)}</div><div class="t-cron">${esc(t.cron)}</div></td>
    <td><span class="t-cmd" title="${esc(t.command)}">${esc(t.command)}</span></td>
    <td>${nodePills(t.nodes)}</td>
    <td>${status}</td>
    <td><div class="row-actions">
      <button data-act="run" class="btn-run" title="立即执行一次">▶ 执行</button>
      ${toggleBtn}
      <button data-act="edit" class="ghost">编辑</button>
      <button data-act="del" class="ghost danger">删除</button>
    </div></td>
  </tr>`;
}
async function refreshTasks() {
  try {
    const r = await rpc("crontask.list");
    try {
      const nodesResp = await rpc("common:getNodes");
      NODES = Object.entries(nodesResp || {}).map(([uuid, info]) => ({ uuid, name: info.name || uuid }));
    } catch { NODES = []; }
    renderNodeList();
    const tbody = $("tasksBody");
    $("taskCount").textContent = r.tasks.length ? `共 ${r.tasks.length} 个` : "";
    if (!r.tasks.length) { tbody.innerHTML = ""; $("tasksEmpty").style.display = "block"; }
    else { $("tasksEmpty").style.display = "none"; tbody.innerHTML = r.tasks.map(taskRow).join(""); }
  } catch (e) { showError("加载任务失败: " + e.message); }
}

// ---------- cron 可视化选择器（先时间、后频率） ----------
const WEEKDAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];
function pad(n) { return String(n).padStart(2, "0"); }
// time input 是 "时:分"，cron 是 "分 时"
function timeToCron(v) { const p = String(v || "00:00").split(":"); return p[1] + " " + p[0]; }
function fmtTime(expr) {
  const p = String(expr).trim().split(/\s+/);
  if (p.length >= 2 && /^\d+$/.test(p[0]) && /^\d+$/.test(p[1])) return pad(p[1]) + ":" + pad(p[0]);
  return "00:00";
}
function currentFreq() {
  return document.querySelector(".cron-freq button.active")?.dataset.freq || "daily";
}
function setFreq(freq) {
  document.querySelectorAll(".cron-freq button").forEach(b => b.classList.toggle("active", b.dataset.freq === freq));
  document.querySelectorAll(".cron-config .row").forEach(r => { r.style.display = r.dataset.cfg === freq ? "" : "none"; });
}
function multiselectVals(sel) {
  return [...document.querySelectorAll(sel + " button.on")].map(b => b.dataset.v);
}
function freqToCron() {
  const freq = currentFreq();
  const t = timeToCron($("cronTime").value);
  switch (freq) {
    case "daily": return t + " * * *";
    case "everyndays": return t + " */" + (Number($("cronEveryDays").value || 2)) + " * *";
    case "weekly": {
      const dows = multiselectVals("#cronWeekdays");
      return t + " * * " + (dows.length ? dows.join(",") : "0");
    }
    case "monthly": return t + " " + $("cronMday").value + " * *";
    case "months": {
      const ms = multiselectVals("#cronMonths");
      return t + " " + $("cronMMday").value + " " + (ms.length ? ms.join(",") : "*") + " *";
    }
    case "interval": return "@every " + Number($("cronEveryN").value || 5) + $("cronEveryUnit").value;
    case "custom": return $("cronCustom").value.trim() || "0 3 * * *";
  }
  return "0 3 * * *";
}
function humanizeCron(expr) {
  const t = String(expr).trim();
  if (/^@every\s+/i.test(t)) return "每 " + t.replace(/^@every\s+/i, "");
  const p = t.split(/\s+/);
  if (p.length < 5) return t;
  // cron 是 "分 时"，人类阅读是 "时:分"
  const tm = pad(p[1]) + ":" + pad(p[0]);
  const dom = p[2], mon = p[3], dow = p[4];
  if (dom.startsWith("*/")) return "每 " + dom.slice(2) + " 天（" + tm + "）";
  if (mon !== "*" && dom !== "*") {
    return "每年 " + String(mon).split(",").join("、") + " 月 " + dom + " 号 " + tm;
  }
  if (dow !== "*" && dom === "*") {
    return "每周" + String(dow).split(",").map(d => WEEKDAY_NAMES[Number(d)]).join("、") + " " + tm;
  }
  if (dom !== "*") return "每月 " + dom + " 号 " + tm;
  if (p[1] !== "*") return "每天 " + tm;
  return t;
}
function updateCronPreview() {
  const expr = freqToCron();
  $("cronPreviewText").textContent = expr;
  $("cronHuman").textContent = humanizeCron(expr);
}
function cronToFreq(expr) {
  const t = String(expr || "").trim();
  if (/^@every\s+/i.test(t)) {
    const m = t.replace(/^@every\s+/i, "").match(/^(\d+)([mhd])$/i);
    if (m) { $("cronEveryN").value = m[1]; $("cronEveryUnit").value = m[2].toLowerCase(); }
    setFreq("interval");
    return;
  }
  const p = t.split(/\s+/);
  if (p.length >= 5) {
    const dom = p[2], mon = p[3], dow = p[4];
    if (dom.startsWith("*/")) {
      $("cronEveryDays").value = dom.slice(2);
      setFreq("everyndays");
    } else if (mon !== "*" && dom !== "*") {
      document.querySelectorAll("#cronMonths button").forEach(b => b.classList.toggle("on", String(mon).split(",").includes(b.dataset.v)));
      $("cronMMday").value = dom;
      setFreq("months");
    } else if (dow !== "*" && dom === "*") {
      document.querySelectorAll("#cronWeekdays button").forEach(b => b.classList.toggle("on", String(dow).split(",").includes(b.dataset.v)));
      setFreq("weekly");
    } else if (dom !== "*") {
      $("cronMday").value = dom;
      setFreq("monthly");
    } else {
      $("cronTime").value = fmtTime(t);
      setFreq("daily");
    }
  } else {
    $("cronCustom").value = t;
    setFreq("custom");
  }
}
function buildCronExpr() { return freqToCron(); }

// 初始化日期下拉（每月几号 / 某月几号共用范围 1-28，避免月末缺失）
for (let i = 1; i <= 28; i++) {
  const o = document.createElement("option");
  o.value = String(i); o.textContent = String(i);
  $("cronMday").appendChild(o);
  $("cronMMday").appendChild(o.cloneNode());
}
$("cronMday").value = "1";
$("cronMMday").value = "1";

// 交互绑定
document.querySelectorAll(".cron-freq button").forEach(b => b.addEventListener("click", () => { setFreq(b.dataset.freq); updateCronPreview(); }));
["cronTime", "cronEveryDays", "cronEveryN", "cronEveryUnit", "cronCustom"].forEach(id => $(id).addEventListener("input", updateCronPreview));
document.querySelectorAll(".cron-multiselect button").forEach(b => b.addEventListener("click", () => { b.classList.toggle("on"); updateCronPreview(); }));
$("cronMday").addEventListener("change", updateCronPreview);
$("cronMMday").addEventListener("change", updateCronPreview);

// ---------- 节点选择器 ----------
function renderNodeList() {
  const filter = $("nodeFilter").value.trim().toLowerCase();
  const list = $("nodeList");
  const matches = NODES.filter((n) =>
    !filter || n.name.toLowerCase().includes(filter) || n.uuid.toLowerCase().includes(filter));
  $("nodeMeta").textContent = `${matches.length} / ${NODES.length} 节点`;
  let html = matches.map((n) => `
    <label class="node-item" title="${esc(n.uuid)}">
      <input type="checkbox" data-uuid="${esc(n.uuid)}" ${selectedNodes.has(n.uuid) ? "checked" : ""}>
      <span class="node-dot"></span>
      <span>${esc(n.name)}</span>
    </label>`).join("");
  if (filter && !matches.length && /^[0-9a-f-]{8,}$/i.test(filter)) {
    html = `<div class="node-add-custom">没有匹配的在线节点，<button type="button" id="btnAddCustom">添加为节点 ID</button></div>`;
  } else if (!matches.length) {
    html = `<div class="node-empty">没有匹配的节点。</div>`;
  }
  list.innerHTML = html;
  const custom = $("btnAddCustom");
  if (custom) custom.addEventListener("click", () => {
    selectedNodes.add(filter); $("nodeFilter").value = ""; renderNodePicker();
  });
}
function renderChips() {
  const chips = $("nodeChips");
  $("nodeCount").textContent = String(selectedNodes.size);
  if (!selectedNodes.size) { chips.innerHTML = '<span class="placeholder">在下方搜索并勾选节点</span>'; return; }
  chips.innerHTML = [...selectedNodes].map((id) => {
    const label = nodeLabel(id);
    return label
      ? `<span class="chip" title="${esc(id)}"><span class="chip-label">${esc(label)}</span><button type="button" data-remove="${esc(id)}" aria-label="移除">✕</button></span>`
      : `<span class="chip custom" title="节点已不在线">${esc(id)}<button type="button" data-remove="${esc(id)}" aria-label="移除">✕</button></span>`;
  }).join("");
}
function renderNodePicker() { renderChips(); renderNodeList(); }
$("nodeList").addEventListener("change", (e) => {
  const cb = e.target.closest("input[data-uuid]");
  if (!cb) return;
  cb.checked ? selectedNodes.add(cb.dataset.uuid) : selectedNodes.delete(cb.dataset.uuid);
  renderChips();
});
$("nodeChips").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-remove]");
  if (!btn) return;
  selectedNodes.delete(btn.dataset.remove); renderNodePicker();
});
$("nodeFilter").addEventListener("input", renderNodeList);
$("nodeFilter").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (v && /^[0-9a-f-]{8,}$/i.test(v) && !NODES.some((n) => n.uuid === v)) {
    selectedNodes.add(v); e.target.value = ""; renderNodePicker();
  }
});

// ---------- 弹框 ----------
function openForm(task) {
  $("formTitle").textContent = task ? "编辑任务" : "新建任务";
  $("f_id").value = task?.id ?? "";
  $("f_name").value = task?.name ?? "";
  cronToFreq(task?.cron ?? "0 3 * * *");
  updateCronPreview();
  $("f_command").value = task?.command ?? "";
  $("f_timeout").value = task?.timeout ?? 300;
  $("f_notify").checked = task ? !!task.notify : true;
  $("f_enabled").checked = task ? !!task.enabled : true;
  selectedNodes = new Set(task?.nodes ?? []);
  $("nodeFilter").value = "";
  renderNodePicker();
  dialog.showModal();
  $("f_name").focus();
}
function closeForm() { dialog.close(); }
async function saveForm(e) {
  e.preventDefault();
  if (!selectedNodes.size) { toast("请至少选择一个目标节点"); return; }
  const payload = {
    id: $("f_id").value,
    name: $("f_name").value.trim(),
    cron: buildCronExpr(),
    command: $("f_command").value,
    nodes: [...selectedNodes],
    timeout: Number($("f_timeout").value || 300),
    notify: $("f_notify").checked,
    enabled: $("f_enabled").checked,
    _operator: CURRENT_USER,
  };
  try {
    const r = await rpc("crontask.save", payload);
    if (!r.ok) throw new Error(r.error);
    toast("已保存");
    closeForm();
    await refreshTasks();
    await refreshHistory();
    await refreshAudit();
  } catch (e2) { showError("保存失败: " + e2.message); }
}

// ---------- 操作 ----------
async function onTaskAction(act, id) {
  try {
    switch (act) {
      case "toggle": {
        const r0 = await rpc("crontask.list");
        const t0 = r0.tasks.find((x) => x.id === id);
        await rpc("crontask.setEnabled", { id, enabled: !t0?.enabled, _operator: CURRENT_USER });
        toast(t0?.enabled ? "已停用" : "已启用");
        break;
      }
      case "run": {
        await rpc("crontask.run", { id, _operator: CURRENT_USER });
        toast("已触发执行");
        setTimeout(refreshHistory, 4000);
        break;
      }
      case "edit": {
        const r = await rpc("crontask.list");
        const t = r.tasks.find((x) => x.id === id);
        if (t) openForm(t);
        return;
      }
      case "del": {
        if (!confirm("确认删除该任务？")) return;
        await rpc("crontask.delete", { id, _operator: CURRENT_USER });
        toast("已删除");
        break;
      }
    }
    await refreshTasks();
    await refreshHistory();
    await refreshAudit();
  } catch (e) { showError("操作失败: " + e.message); }
}
$("tasksBody").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  onTaskAction(btn.dataset.act, btn.closest("tr").dataset.id);
});

// ---------- 执行历史（可展开） ----------
function nodeResultBlock(r) {
  const label = nodeLabel(r.client);
  const exit = r.exit_code;
  const exitCls = exit === 0 ? "zero" : "nonzero";
  const exitText = exit === null || exit === undefined ? "未返回" : `exit ${exit}`;
  const name = label ? esc(label) : `<span class="mono" style="font-size:11px">${esc(r.client.slice(0, 13))}…</span>`;
  return `<div class="h-node">
    <div class="h-node-head">
      <span class="h-node-name">${name}</span>
      <span class="h-exit ${exitCls}">${exitText}</span>
    </div>
    <div class="h-out">${esc(r.result)}</div>
  </div>`;
}
function historyItem(h, open) {
  const failed = h.results.some((r) => r.exit_code !== 0);
  const verdict = h.timedOut
    ? '<span class="badge warn">超时</span>'
    : failed ? '<span class="badge fail">失败</span>' : '<span class="badge ok">成功</span>';
  const absTime = new Date(h.ts).toLocaleString();
  const results = h.results.length
    ? h.results.map(nodeResultBlock).join("")
    : '<div class="h-noresult">（本轮没有收到任何节点的结果）</div>';
  return `<div class="h-item ${open ? "open" : ""}">
    <div class="h-head" data-toggle>
      <span class="h-name">${esc(h.name)}</span>
      ${verdict}
      <span class="h-time" title="${esc(absTime)}">${esc(timeAgo(h.ts))}</span>
      <span class="h-toggle">▾</span>
    </div>
    <div class="h-body" ${open ? "" : "hidden"}>
      <div class="h-cmd" title="${esc(h.command)}">${esc(h.command)}</div>
      ${results}
    </div>
  </div>`;
}
const AUDIT_ACTION = {
  create: ["创建", "ok"], update: ["更新", "ok"], delete: ["删除", "fail"],
  enable: ["启用", "ok"], disable: ["停用", "warn"], run: ["手动执行", "ok"],
};
let CURRENT_USER = "admin";
async function loadCurrentUser() {
  try {
    const me = await rpc("common:getMe");
    if (me && me.username) CURRENT_USER = me.username;
  } catch { /* keep default */ }
}
function auditRow(a) {
  const [label, tone] = AUDIT_ACTION[a.action] || [a.action, ""];
  return `<div class="h-item">
    <div class="h-head" style="cursor:default">
      <span class="h-name">${esc(label)}</span>
      <span class="badge ${tone}">${esc(a.taskName)}</span>
      <span class="h-time" title="${esc(new Date(a.ts).toLocaleString())}">${esc(timeAgo(a.ts))}</span>
    </div>
    <div class="h-body" style="display:block;border-top:1px solid #f1f5f9;padding:8px 14px">
      <span class="muted">操作者：</span><strong>${esc(a.operator)}</strong>
      <span class="muted" style="margin-left:12px">${esc(a.detail)}</span>
    </div>
  </div>`;
}
async function refreshAudit() {
  try {
    const r = await rpc("crontask.audit", { limit: 100 });
    const items = r.audit || [];
    $("auditCount").textContent = items.length ? `共 ${items.length} 条` : "";
    $("auditList").innerHTML = items.length
      ? items.map(auditRow).join("")
      : '<div class="empty">暂无操作记录</div>';
  } catch (e) {
    $("auditList").innerHTML = '<div class="empty">操作日志加载失败: ' + esc(e.message) + "</div>";
  }
}
async function refreshHistory() {
  try {
    const r = await rpc("crontask.history", { limit: 50 });
    const items = r.history || [];
    $("historyCount").textContent = items.length ? `共 ${items.length} 条` : "";
    $("historyList").innerHTML = items.length
      ? items.map(h => historyItem(h, false)).join("")
      : '<div class="empty">暂无执行记录，任务触发后会显示在这里</div>';
  } catch (e) {
    $("historyList").innerHTML = '<div class="empty">历史加载失败: ' + esc(e.message) + "</div>";
  }
}
$("historyList").addEventListener("click", (e) => {
  const head = e.target.closest(".h-head[data-toggle]");
  if (!head) return;
  const item = head.closest(".h-item");
  const body = item.querySelector(".h-body");
  const isOpen = !body.hidden;
  body.hidden = isOpen;
  item.classList.toggle("open", !isOpen);
});
$("btnExpandAll").addEventListener("click", () => {
  document.querySelectorAll(".h-item").forEach(item => {
    item.querySelector(".h-body").hidden = false;
    item.classList.add("open");
  });
});
$("btnCollapseAll").addEventListener("click", () => {
  document.querySelectorAll(".h-item").forEach(item => {
    item.querySelector(".h-body").hidden = true;
    item.classList.remove("open");
  });
});

// ---------- 初始化 ----------
$("btnNew").addEventListener("click", () => openForm(null));
$("btnClose").addEventListener("click", closeForm);
$("btnCancel").addEventListener("click", closeForm);
$("btnRefresh").addEventListener("click", () => { refreshTasks(); refreshHistory(); refreshAudit(); });
$("btnRefreshAudit").addEventListener("click", refreshAudit);
$("taskForm").addEventListener("submit", saveForm);
dialog.addEventListener("cancel", (e) => { e.preventDefault(); closeForm(); });

(async () => {
  await loadCurrentUser();
  await refreshTasks();
  await refreshHistory();
  await refreshAudit();
})();
</script>
