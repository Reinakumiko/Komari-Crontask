name: Release

# 打 v* tag 即发布：校验 manifest 版本与 tag 一致 → 全部门禁 → 打包 →
# 创建 GitHub Release 并上传 zip。随后 update-catalog.yml 会自动把
# market/v1.json 的 version/download/sha256 更新为本次发布。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MANIFEST=$(python3 -c "import json;print(json.load(open('komari-plugin.json'))['version'])")
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::manifest version $MANIFEST does not match tag $VERSION"
            exit 1
          fi
          echo "releasing $TAG (manifest $MANIFEST)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate manifest
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Pack plugin archive
        run: npm run pack

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          ASSET="dist/crontask-${VERSION}.zip"
          ls -la "$ASSET"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release exists, uploading asset"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "$ASSET"
          fi